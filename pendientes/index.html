<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendientes</title>
<meta name="description" content="Tus pendientes por tema, con avisos en el Calendario del iPhone.">
<meta name="robots" content="noindex">
<meta name="theme-color" id="metaTheme" content="#F4F5F7">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="top wrap">
  <div class="top__row">
    <button type="button" class="back" id="btnBack" hidden><span data-icon="chevL"></span>Inicio</button>
    <span class="top__spacer"></span>
    <button type="button" class="icon-btn" id="btnSettings" aria-label="Ajustes"><span data-icon="gear"></span></button>
  </div>
  <h1 class="title" id="viewTitle" tabindex="-1">Hoy</h1>
  <p class="subtitle" id="viewSub"></p>
</header>

<main id="main" class="wrap"></main>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar__inner">
    <button type="button" class="tab" data-go="inicio" id="tabInicio"><span data-icon="home"></span><span>Inicio</span></button>
    <button type="button" class="tab tab--new" id="btnNew"><span data-icon="plus"></span><span>Nuevo</span></button>
    <button type="button" class="tab" data-go="agenda" id="tabAgenda"><span data-icon="calendar"></span><span>Agenda</span></button>
  </div>
</nav>

<!-- Ficha de un pendiente -->
<dialog class="sheet" id="detailSheet" aria-labelledby="detailTitle">
  <div class="sheet__in">
    <header class="sheet__head">
      <span class="sheet__title" id="detailTopic"></span>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar"><span data-icon="x"></span></button>
    </header>
    <div class="sheet__body" id="detailBody"></div>
  </div>
</dialog>

<!-- Nuevo / editar: pregunta de a una cosa -->
<dialog class="sheet sheet--page" id="formSheet" aria-labelledby="formTitle">
  <form class="sheet__in" id="itemForm" novalidate autocomplete="off">
    <header class="sheet__head">
      <h2 class="sheet__title" id="formTitle" tabindex="-1">Nuevo pendiente</h2>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar"><span data-icon="x"></span></button>
    </header>
    <div class="sheet__body" id="formBody"></div>
    <footer class="sheet__foot">
      <p class="form-err" id="formErr" role="alert"></p>
      <button type="submit" class="btn btn--primary btn--block" id="btnSave">Guardar</button>
    </footer>
  </form>
</dialog>

<!-- Ajustes -->
<dialog class="sheet" id="settingsSheet" aria-labelledby="settingsTitle">
  <div class="sheet__in">
    <header class="sheet__head">
      <h2 class="sheet__title" id="settingsTitle">Ajustes</h2>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar"><span data-icon="x"></span></button>
    </header>
    <div class="sheet__body" id="settingsBody"></div>
  </div>
</dialog>

<datalist id="dl_people"></datalist>
<datalist id="dl_places"></datalist>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="ics.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
