<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto — OJO</title>
<meta name="description" content="Elegí tu armazón y armalo con cristales oftálmicos a medida. Te recomendamos el índice según tu graduación. Envío sin cargo y 6 cuotas sin interés.">
<meta name="theme-color" content="#F4EFE7">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/paginas.css">
</head>
<body>
<a class="salto" href="#principal">Saltar al contenido</a>
<header id="cabecera"></header>

<main id="principal">
  <div class="envoltorio">
    <nav class="migas" aria-label="Miga de pan" id="migas"></nav>
  </div>

  <section class="seccion" style="padding-top:0">
    <div class="envoltorio">
      <div class="ficha" id="ficha">
        <!-- lo llena js/producto.js -->
      </div>
    </div>
  </section>

  <section class="seccion seccion--hueso2" id="seccionRelacionados" hidden>
    <div class="envoltorio">
      <div class="seccion__cabeza">
        <div class="seccion__cabeza-texto">
          <p class="volanta"><span class="volanta__punto"></span>Parecidos</p>
          <h2>También te <em class="ital">pueden gustar</em></h2>
        </div>
      </div>
      <div class="grilla grilla--4" id="relacionados"></div>
    </div>
  </section>
</main>

<!-- Barra fija de compra en mobile -->
<div class="barra-fija" id="barraFija">
  <div class="crece">
    <p class="barra-fija__precio" id="barraPrecio">—</p>
    <p class="barra-fija__cuotas" id="barraCuotas"></p>
  </div>
  <button class="btn btn--acento" id="barraAgregar">Agregar</button>
</div>

<footer id="pie"></footer>

<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/marcos.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/cristales.js"></script>
<script src="js/promos.js"></script>
<script src="js/carrito.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/producto.js"></script>
</body>
</html>
