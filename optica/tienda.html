<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo — OJO</title>
<meta name="description" content="Anteojos de sol y de receta de Central, Duna, Seró, Kaio y Maré. Filtrá por forma, material, color y precio. Envío sin cargo a todo el país.">
<meta name="theme-color" content="#F4EFE7">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/paginas.css">
</head>
<body>
<a class="salto" href="#principal">Saltar al contenido</a>
<header id="cabecera"></header>

<main id="principal">
  <div class="envoltorio">
    <nav class="migas" aria-label="Miga de pan">
      <a href="index.html">Inicio</a>
      <span class="migas__sep">/</span>
      <span id="migaActual">Catálogo</span>
    </nav>
  </div>

  <section class="seccion" style="padding-top:0">
    <div class="envoltorio">

      <div class="seccion__cabeza">
        <div class="seccion__cabeza-texto">
          <p class="volanta"><span class="volanta__punto"></span><span id="volantaTexto">Todo el catálogo</span></p>
          <h1 id="tituloCatalogo">El <em class="ital">catálogo</em></h1>
          <p class="bajada mt-s" id="bajadaCatalogo">
            Cinco marcas curadas. Todos los modelos se pueden armar con cristales de receta
            y todos van con envío sin cargo.
          </p>
        </div>
      </div>

      <!-- Cambio rápido sol / receta / todo -->
      <div class="fila fila--envuelve" style="margin-bottom:24px" id="tiposRapidos"></div>

      <div class="tienda">
        <!-- ============ Filtros ============ -->
        <aside class="filtros" id="filtros" aria-label="Filtros">
          <div id="filtrosCuerpo"></div>
        </aside>

        <!-- ============ Resultados ============ -->
        <div>
          <div class="tienda__barra">
            <button class="btn btn--fantasma btn--chico" id="btnFiltros" hidden>Filtros</button>
            <p class="tienda__conteo" id="conteo" role="status" aria-live="polite"></p>
            <label class="fila" style="gap:8px">
              <span class="nota">Ordenar</span>
              <select class="select" id="orden" style="width:auto;padding-block:9px">
                <option value="relevancia">Relevancia</option>
                <option value="precio-asc">Menor precio</option>
                <option value="precio-desc">Mayor precio</option>
                <option value="nuevos">Novedades</option>
                <option value="nombre">Nombre</option>
              </select>
            </label>
          </div>

          <div class="tienda__activos" id="filtrosActivos"></div>

          <div class="grilla grilla--3" id="grilla"></div>
        </div>
      </div>

    </div>
  </section>
</main>

<footer id="pie"></footer>

<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/marcos.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/cristales.js"></script>
<script src="js/promos.js"></script>
<script src="js/carrito.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/tienda.js"></script>
</body>
</html>
