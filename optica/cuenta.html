<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi cuenta — OJO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE7">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/paginas.css">
</head>
<body>
<a class="salto" href="#principal">Saltar al contenido</a>
<header id="cabecera"></header>

<main id="principal">
  <div class="envoltorio">
    <nav class="migas" aria-label="Miga de pan">
      <a href="index.html">Inicio</a><span class="migas__sep">/</span><span>Mi cuenta</span>
    </nav>
  </div>

  <section class="seccion" style="padding-top:0">
    <div class="envoltorio">

      <!-- ============ Sin sesión ============ -->
      <div id="anonimo" hidden>
        <div class="envoltorio--angosto" style="text-align:center;padding-block:clamp(40px,6vw,90px);margin-inline:auto">
          <h1>Entrá a tu <em class="ital">cuenta</em></h1>
          <p class="bajada mt-m" style="margin-inline:auto">
            Con tu cuenta guardás tu receta para no volver a cargarla, seguís tus pedidos
            y ves tus turnos. Es un toque y listo.
          </p>
          <div class="fila fila--centro mt-l" id="zonaGoogleCuenta"></div>
          <p class="nota mt-l">
            No publicamos nada ni te mandamos spam. Sólo usamos tu nombre, tu email y tu foto.
          </p>
        </div>
      </div>

      <!-- ============ Con sesión ============ -->
      <div id="panel" hidden>
        <div class="seccion__cabeza">
          <div class="seccion__cabeza-texto">
            <h1>Mi <em class="ital">cuenta</em></h1>
          </div>
        </div>

        <div class="cuenta">
          <aside>
            <div class="cuenta__perfil" id="perfil"></div>
            <nav class="cuenta__menu" role="tablist" aria-label="Secciones de la cuenta">
              <button class="cuenta__tab" role="tab" data-tab="pedidos" aria-selected="true">Mis pedidos</button>
              <button class="cuenta__tab" role="tab" data-tab="recetas" aria-selected="false">Mis recetas</button>
              <button class="cuenta__tab" role="tab" data-tab="turnos" aria-selected="false">Mis turnos</button>
            </nav>
            <div class="mt-l">
              <button class="btn btn--fantasma btn--bloque btn--chico" id="salir">Cerrar sesión</button>
            </div>
          </aside>

          <div id="contenido"></div>
        </div>
      </div>

    </div>
  </section>
</main>

<footer id="pie"></footer>

<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/marcos.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/cristales.js"></script>
<script src="js/promos.js"></script>
<script src="js/carrito.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/cuenta.js"></script>
</body>
</html>
