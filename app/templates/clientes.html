{% extends "base.html" %}
{% block title %}Clientes - FactuApp{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Clientes</h2>
    <button class="btn btn-primary" onclick="mostrarForm()">Nuevo Cliente</button>
</div>

<div id="modal-cliente" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="form-titulo">Nuevo Cliente</h3>
            <button class="btn-close" onclick="cerrarModal('modal-cliente')">&times;</button>
        </div>
        <form id="form-cliente" onsubmit="guardarCliente(event)">
            <input type="hidden" id="cliente-id">
            <div class="form-group">
                <label>Nombre *</label>
                <input type="text" id="cliente-nombre" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="cliente-email">
            </div>
            <div class="form-group">
                <label>Tel&eacute;fono</label>
                <input type="text" id="cliente-telefono">
            </div>
            <div class="form-group">
                <label>CUIT/CUIL</label>
                <input type="text" id="cliente-cuit">
            </div>
            <div class="form-group">
                <label>Direcci&oacute;n</label>
                <input type="text" id="cliente-direccion">
            </div>
            <div class="form-group">
                <label>Notas</label>
                <textarea id="cliente-notas" rows="2"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<table class="data-table">
    <thead>
        <tr><th>Nombre</th><th>Email</th><th>Tel&eacute;fono</th><th>CUIT/CUIL</th><th>Acciones</th></tr>
    </thead>
    <tbody id="clientes-body">
        <tr><td colspan="5" class="empty">Cargando...</td></tr>
    </tbody>
</table>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', cargarClientes);

async function cargarClientes() {
    const res = await fetch('/api/clientes/');
    const clientes = await res.json();
    const tbody = document.getElementById('clientes-body');

    if (!clientes.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No hay clientes</td></tr>';
        return;
    }

    tbody.innerHTML = clientes.map(c => `
        <tr>
            <td>${c.nombre}</td>
            <td>${c.email || '-'}</td>
            <td>${c.telefono || '-'}</td>
            <td>${c.cuit_cuil || '-'}</td>
            <td class="acciones">
                <button class="btn btn-sm" onclick='editarCliente(${JSON.stringify(c)})'>Editar</button>
                <button class="btn btn-sm btn-danger" onclick="eliminarCliente(${c.id})">X</button>
            </td>
        </tr>
    `).join('');
}

function mostrarForm() {
    document.getElementById('form-titulo').textContent = 'Nuevo Cliente';
    document.getElementById('form-cliente').reset();
    document.getElementById('cliente-id').value = '';
    document.getElementById('modal-cliente').style.display = 'flex';
}

function editarCliente(c) {
    document.getElementById('form-titulo').textContent = 'Editar Cliente';
    document.getElementById('cliente-id').value = c.id;
    document.getElementById('cliente-nombre').value = c.nombre;
    document.getElementById('cliente-email').value = c.email || '';
    document.getElementById('cliente-telefono').value = c.telefono || '';
    document.getElementById('cliente-cuit').value = c.cuit_cuil || '';
    document.getElementById('cliente-direccion').value = c.direccion || '';
    document.getElementById('cliente-notas').value = c.notas || '';
    document.getElementById('modal-cliente').style.display = 'flex';
}

async function guardarCliente(e) {
    e.preventDefault();
    const id = document.getElementById('cliente-id').value;
    const body = {
        nombre: document.getElementById('cliente-nombre').value,
        email: document.getElementById('cliente-email').value || null,
        telefono: document.getElementById('cliente-telefono').value || null,
        cuit_cuil: document.getElementById('cliente-cuit').value || null,
        direccion: document.getElementById('cliente-direccion').value || null,
        notas: document.getElementById('cliente-notas').value || null,
    };

    const url = id ? `/api/clientes/${id}` : '/api/clientes/';
    const method = id ? 'PUT' : 'POST';

    const res = await fetch(url, {
        method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
    });

    if (res.ok) {
        cerrarModal('modal-cliente');
        cargarClientes();
    } else {
        const err = await res.json();
        alert(err.detail || 'Error');
    }
}

async function eliminarCliente(id) {
    if (!confirm('Eliminar este cliente?')) return;
    await fetch(`/api/clientes/${id}`, {method: 'DELETE'});
    cargarClientes();
}

function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
{% endblock %}
